name: Update EV Charger Data (daily region)

on:
  workflow_dispatch:
    inputs:
      full_seed:
        description: "전체 지역을 한 번에 갱신 (전국 데이터 초기 채우기용, 평소엔 체크하지 않음)"
        type: boolean
        default: false
      retry_pending:
        description: "재시도 대기 지역만 다시 받기 (홈 스케줄러가 실패 후 자동 재시도할 때 씀, 대기 지역이 없으면 아무것도 안 함)"
        type: boolean
        default: false
      region_day:
        description: "갱신할 지역 (요일별 담당 로테이션 기준). full_seed 체크 시 이 값은 무시됨"
        type: choice
        default: "오늘"
        # 옵션 글자 자체가 곧 전달되는 값이라(드롭다운에 값/표시 분리가 안 됨),
        # 지역명을 괄호로 같이 적어둔다. scripts/gov_charger_api.py의
        # DAY_ZCODE_GROUPS 매핑이 바뀌면 여기도 같이 고쳐야 한다.
        options:
          - "오늘"
          - "월(경기·충남·제주)"
          - "화(서울·광주전남·세종)"
          - "수(부산·대전)"
          - "목(경남·충북)"
          - "금(인천·강원)"
          - "토(경북·전북)"
          - "일(대구·울산)"

# 러너가 한동안 오프라인이면 대기열에 여러 번 쌓일 수 있다. 같은
# concurrency 그룹으로 묶으면 "아직 시작 안 한(대기 중)" 이전 실행은
# 자동으로 취소되고 최신 것만 남는다. cancel-in-progress는 기본값(false)
# 그대로 둬서, 이미 실행 중인 FULL_SEED(오래 걸릴 수 있음)는 중간에
# 취소되지 않고 끝까지 돈다 — 대기 중인 중복만 정리된다.
concurrency:
  group: update-chargers

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, home-pc]
    env:
      EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
      RETRY_PENDING: ${{ inputs.retry_pending && '1' || '' }}
      REGION_DAY: ${{ inputs.region_day }}
      PYTHONUNBUFFERED: "1"  # 로그가 실행 끝에 한꺼번에 찍히지 않고 실제 시각대로 남게 한다
    steps:
      # dispatch된 시점의 커밋이 아니라 "지금" main의 최신 커밋에서 시작한다.
      # 러너가 하나라 잡은 순서대로 돌지만, 같은 시각에 dispatch된 상태
      # 갱신이 먼저 돌아 push하고 나면 dispatch 시점 커밋은 이미 옛것이라
      # 우리 push가 거부된다 — 그걸 막는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 일부 지역이라도 갱신에 실패하면 종료 코드 1로 끝난다(실행이 빨간색으로
      # 표시됨). 그래도 성공한 지역과 재시도 대기 기록은 아래 단계에서 커밋한다.
      - name: Fetch charger info
        run: python scripts/fetch_chargers.py

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: >
          scripts/commit_and_push.sh
          "chore: charger data refresh"
          "python scripts/fetch_chargers.py"
          docs/data/chargers.geojson
