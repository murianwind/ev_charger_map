name: Update EV Charger Status (delta)

on:
  workflow_dispatch: {}

# 러너가 한동안(예: 도커 데스크탑 재시작 등으로) 오프라인이면, 10분마다
# 오는 dispatch가 대기열에 계속 쌓인다. 같은 concurrency 그룹으로 묶으면,
# 새 실행이 대기열에 들어올 때 "아직 시작 안 한(대기 중)" 이전 실행은
# 자동으로 취소되고 최신 것 하나만 남는다 — 밀린 걸 다 처리할 필요 없이
# 최신 상태만 반영하면 되는 델타 갱신 특성과도 잘 맞는다.
concurrency:
  group: update-status

permissions:
  contents: write

jobs:
  update-status:
    runs-on: [self-hosted, home-pc]
    env:
      EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
      EV_STATUS_PERIOD_MIN: "10"
      PYTHONUNBUFFERED: "1"  # 로그가 실행 끝에 한꺼번에 찍히지 않고 실제 시각대로 남게 한다
    steps:
      # dispatch된 시점의 커밋이 아니라 "지금" main의 최신 커밋에서 시작한다
      # (앞서 돈 지역 갱신이 push한 내용 위에서 출발해야 push가 거부되지 않는다).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch status delta
        run: python scripts/fetch_status.py

      - name: Commit status changes
        run: >
          scripts/commit_and_push.sh
          "chore: charger status delta update"
          "python scripts/fetch_status.py"
          docs/data/chargers.geojson
